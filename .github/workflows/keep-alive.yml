name: Keep Render Warm

on:
  schedule:
    # Ping every 10 minutes (Render sleeps after ~15)
    - cron: "*/10 * * * *"
  workflow_dispatch:   # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the Render API health endpoint
        run: |
          curl --silent --show-error --fail https://bloomr-api.onrender.com/admin/login/?next=/admin/
